<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Civilization: World</title>
<style>
:root{--bg:#14161c;--fg:#d8dce6;--mut:#8a90a0}
@media (prefers-color-scheme:light){:root{--bg:#eef0f4;--fg:#1a1d24;--mut:#5a6070}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0}
canvas{width:100%;image-rendering:pixelated;background:#2f4a2c;border:2px solid #000;display:block}
#bar,#tip{font:12px monospace;color:var(--mut);min-height:16px;margin:6px 0}
#warn{background:#7a3b2e;color:#fff;padding:4px 8px;display:none}
ul{padding-left:18px;margin:4px 0}
</style></head><body><main>
<h1>Digital Civilization</h1>
<div id="warn"></div><div id="bar">loading…</div>
<canvas id="c" width="800" height="500"></canvas>
<div id="tip"></div>
<h2 style="font-size:14px">Chronicle</h2><ul id="feed"></ul>
</main>
<script>
"use strict";
const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const COL={core:'#4aa3ff',hermes:'#5fd16b',local:'#ffb347'};
let w=null,t=0,lots=[];
const px=(x,y,a,b,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,a,b)};
const txt=(s,x,y,c)=>{g.fillStyle=c||'#fff';g.font='9px monospace';g.fillText(s,x|0,y|0)};
function building(x,y,a,b,c){px(x,y+6,a,b-6,c);px(x-1,y,a+2,7,'#7a3b2e');px(x+a/2-2,y+b-8,4,8,'#222')}
function scaffold(x,y){px(x,y,24,30,'#6b5a3a');px(x+2,y+2,20,26,'#2f4a2c');for(let i=0;i<3;i++)px(x,y+8+i*8,24,2,'#c9a44c')}
function person(x,y,c,bob,tool){px(x-3,y-13+bob,6,2,c);px(x-3,y-11+bob,6,4,'#f1c9a0');px(x-4,y-7+bob,8,7,c);
  px(x-4,y+bob,3,3,'#222');px(x+1,y+bob,3,3,'#222');if(tool)px(x+5,y-8+(t%2?-3:0),2,6,'#ddd')}
function draw(){
  g.clearRect(0,0,800,500);px(0,0,800,500,'#2f4a2c');
  px(0,110,800,6,'#8a7a5a');px(0,350,800,6,'#8a7a5a');
  if(!w)return;lots=[];
  building(350,14,100,60,'#9aa3b8');txt('Charter Hall',362,88);
  building(40,20,70,50,'#b08a5a');txt('Chronicle '+w.journal.length,40,84);
  building(660,20,70,50,'#8a6aa8');txt('Approval: '+w.pending_contributions,660,84);
  const built={};w.inventions.forEach(i=>{if(i.task)built[i.task]=i});
  w.districts.slice(0,10).forEach((d,i)=>{
    const col=i%5,row=(i/5)|0,px0=10+col*160,py0=122+row*118;
    px(px0,py0,148,100,'#6f5f43');txt(d.name.slice(0,24),px0+4,py0+10,'#fff');
    d.tasks.slice(0,10).forEach((tk,k)=>{
      const x=px0+9+(k%5)*27,y=py0+18+((k/5)|0)*38,b=built[tk.n];
      if(b){building(x,y,22,30,'#4aa3ff')}else{px(x,y,22,30,'#7d6d50');px(x+2,y+2,18,26,'#6f5f43')}
      lots.push({x,y,w:22,h:30,s:'#'+tk.n+' '+tk.title+(b?'  [BUILT: '+b.name+']':'  [open]')})});
  });
  let fx=20;w.inventions.filter(i=>!i.task).forEach(i=>{building(fx,372,30,34,'#e0a040');txt(i.name.slice(0,12),fx-4,418);
    lots.push({x:fx,y:372,w:30,h:34,s:i.name+': '+i.summary});fx+=50});
  w.branches.forEach(b=>{scaffold(fx,374);txt(b.slice(-12),fx-4,418);lots.push({x:fx,y:374,w:24,h:30,s:'under construction: '+b});fx+=44});
  const busy={};w.working.forEach((k,i)=>{busy[k.agent]=1;const x=70+i*90;
    px(x-14,440,28,6,'#5a4630');
    if(k.stalled){g.globalAlpha=.5;person(x,436,'#888',0,false);g.globalAlpha=1;txt('zz #'+k.task,x-14,458,'#aaa')}
    else{person(x,436,COL[k.agent]||'#c0c0d0',(t%2),true);txt(k.agent+' #'+k.task,x-24,458)}});
  const idle=w.agents.filter(a=>!busy[a.id]);
  idle.forEach((a,i)=>{const x=80+i*110+Math.sin(t/8+i)*18;person(x,486,COL[a.id]||'#8a8aa0',0,false);txt(a.id,x-18,498,'#cfd')});
}
function show(d){w=d;const c=d.counts;
  $('warn').style.display=d.demo?'block':'none';$('warn').textContent=d.demo?'DEMO DATA':'';
  $('bar').textContent='updated '+d.generated.slice(0,19).replace('T',' ')+' UTC  |  pending '+c.pending+'  running '+c.running+'  done '+c.done+'  failed '+c.failed;
  const f=$('feed');f.textContent='';d.journal.forEach(s=>{const li=document.createElement('li');li.textContent=s;f.appendChild(li)})}
async function poll(){try{const r=await fetch('world.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;show(await r.json())}
  catch(e){$('bar').textContent='world.json unavailable (open via the local --serve, or the published page)'}}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*500/r.height;
  const l=lots.find(l=>x>=l.x&&x<=l.x+l.w&&y>=l.y&&y<=l.y+l.h);$('tip').textContent=l?l.s:''});
setInterval(()=>{t++;draw()},150);poll();setInterval(poll,10000);
</script></body></html>
