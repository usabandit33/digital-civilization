<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Civilization</title>
<style>
body{margin:0;background:#0c0f14;color:#e6eaf2;font:14px/1.4 system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 2px;font-weight:600}
.sub{color:#8b93a3;font-size:12px;margin-bottom:10px}
canvas{width:100%;image-rendering:pixelated;background:#163020;border:2px solid #080a0e;display:block;border-radius:2px}
#bar{font:11px ui-monospace,monospace;color:#8b93a3;margin:6px 0}
#tip{font:12px ui-monospace,monospace;background:#161a22;padding:6px 10px;border-radius:4px;min-height:18px;margin-top:6px}
ul{padding-left:18px;margin:8px 0}
</style></head><body><main>
<h1>Digital Civilization</h1>
<div class="sub">Living map · hover for details</div>
<div id="bar">loading…</div>
<canvas id="c" width="800" height="480"></canvas>
<div id="tip"></div>
<h2 style="font-size:13px;margin:12px 0 4px">Chronicle</h2>
<ul id="feed"></ul>
</main>
<script>
"use strict";
const cv=document.getElementById('c'), g=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=null, t=0, hot=[];
const A={core:'#4aa3ff',hermes:'#5fd16b',local:'#ffb347'};

function r(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w,h)}
function t_(s,x,y,c){g.fillStyle=c||'#fff';g.font='8px ui-monospace,monospace';g.fillText(s,x|0,y|0)}

function grass(){
  for(let y=0;y<480;y+=4)for(let x=0;x<800;x+=4){
    const n=((x*13+y*17)&7);
    r(x,y,4,4,n<1?'#1e4a28':n<3?'#245530':'#2a5e36');
  }
}
function path(x,y,w,h){r(x,y,w,h,'#6a5538');r(x+1,y+1,w-2,h-2,'#7a6544')}

function tree(x,y){
  r(x+3,y+8,2,5,'#3d2a18');
  r(x,y,8,8,'#1e5a2a'); r(x+1,y+1,6,5,'#26703a');
}
function bush(x,y){r(x,y,6,4,'#1a4a28'); r(x+1,y+1,4,2,'#226034')}

function house(x,y,bw,bh,body,roof){
  r(x+1,y+bh-2,bw,3,'#0e1a12'); // shadow
  r(x,y+6,bw,bh-6,body);
  r(x-1,y,bw+2,7,roof); r(x-2,y+2,bw+4,4,roof);
  r(x+bw/2-2,y+bh-8,4,8,'#2a2016'); // door
  if(bw>18){r(x+3,y+9,3,3,'#b8d4e8'); r(x+bw-6,y+9,3,3,'#b8d4e8')}
}

function lot(x,y){r(x,y,16,20,'#4a3c28'); r(x+1,y+1,14,18,'#3d3220'); r(x+6,y+8,4,4,'#5a4a32')}

function worker(x,y,col,f,busy){
  const b=busy&&(f%6<3)?1:0;
  r(x-3,y+1,6,2,'#0e1a12');
  r(x-3,y-10+b,6,6,col);
  r(x-2,y-13+b,4,3,'#f0c8a0');
  r(x-3,y-4+b,2,4,'#222'); r(x+1,y-4+b,2,4,'#333');
  if(busy) r(x+4,y-8+(f%4<2?-1:0),1,5,'#ddd');
}

function draw(){
  g.clearRect(0,0,800,480);
  grass();
  if(!W){t_('loading…',360,240);return}
  hot=[];

  // main paths
  path(0,88,800,6);
  path(0,280,800,6);
  path(390,88,8,200);

  // plaza
  r(340,16,120,60,'#5a4a32');
  r(348,22,104,48,'#6a5538');

  // landmarks
  house(360,20,80,46,'#8a9ab0','#5a4030');
  t_('Charter',378,74);
  hot.push({x:360,y:20,w:80,h:46,s:'Charter Hall'});

  house(24,14,70,42,'#c09060','#6a3020');
  t_('Chronicle',32,64);
  hot.push({x:24,y:14,w:70,h:42,s:'Chronicle · '+(W.journal||[]).length+' entries'});

  house(700,14,70,42,'#7a5a90','#3a2a4a');
  t_('Approval',712,64);
  hot.push({x:700,y:14,w:70,h:42,s:'Approval desk · '+(W.pending_contributions||0)+' pending'});

  // trees & bushes
  tree(320,30); tree(500,26); tree(18,60); tree(760,58);
  bush(300,70); bush(510,68); bush(40,100); bush(740,100);

  // districts
  const built={};
  (W.inventions||[]).forEach(i=>{if(i.task)built[i.task]=i});
  (W.districts||[]).slice(0,10).forEach((d,i)=>{
    const cx=i%5, ry=(i/5)|0;
    const ox=12+cx*156, oy=108+ry*86;
    r(ox,oy,146,78,'#2a422c');
    r(ox+1,oy+1,144,76,'#243a28');
    t_(d.name.slice(0,18),ox+3,oy+10);
    (d.tasks||[]).slice(0,8).forEach((tk,k)=>{
      const x=ox+6+(k%4)*34, y=oy+16+((k/4)|0)*30;
      if(built[tk.n]) house(x,y,18,24,'#3a7ad0','#1e4a80');
      else lot(x,y);
      hot.push({x,y,w:18,h:24,s:'#'+tk.n+' '+tk.title+(built[tk.n]?'  [built]':'')});
    });
  });

  // workshop inventions
  let fx=20;
  (W.inventions||[]).filter(i=>!i.task).forEach(i=>{
    house(fx,360,22,26,'#d09040','#7a4a18');
    t_(i.name.slice(0,8),fx-2,396);
    hot.push({x:fx,y:360,w:22,h:26,s:i.name});
    fx+=36;
  });

  // scaffolds
  (W.branches||[]).forEach(b=>{
    r(fx,362,16,22,'#5a4a32');
    for(let i=0;i<3;i++) r(fx,366+i*6,16,1,'#c9a44c');
    hot.push({x:fx,y:362,w:16,h:22,s:'scaffold: '+b});
    fx+=28;
  });

  // agents
  const busy={};
  (W.working||[]).forEach((k,i)=>{
    busy[k.agent]=1;
    const x=40+i*70+Math.sin(t/10+i)*8;
    worker(x,430,A[k.agent]||'#aaa',t,!k.stalled);
    if(k.stalled){g.globalAlpha=.5;t_('zz',x-4,414,'#aaa');g.globalAlpha=1}
    hot.push({x:x-6,y:416,w:12,h:16,s:k.agent+' #'+k.task});
  });
  (W.agents||[]).filter(a=>!busy[a.id]).forEach((a,i)=>{
    const x=30+i*60+Math.sin(t/14+i)*14;
    worker(x,452,A[a.id]||'#888',t,false);
    hot.push({x:x-6,y:438,w:12,h:16,s:a.id});
  });

  // birds
  if((t%50)<25){r(180+(t%120),20,2,2,'#eee'); r(620-(t%100),32,2,2,'#eee')}
}

function show(d){
  W=d;
  const c=d.counts||{};
  $('bar').textContent='updated '+(d.generated||'').slice(0,19).replace('T',' ')+'  |  p '+(c.pending||0)+'  r '+(c.running||0)+'  d '+(c.done||0)+'  f '+(c.failed||0);
  const f=$('feed'); f.textContent='';
  (d.journal||[]).forEach(s=>{const li=document.createElement('li');li.textContent=s;f.appendChild(li)});
}

async function poll(){
  try{
    const r=await fetch('world.json?'+Date.now(),{cache:'no-store'});
    if(r.ok) show(await r.json());
  }catch(e){$('bar').textContent='no world.json'}
}

cv.onmousemove=e=>{
  const b=cv.getBoundingClientRect();
  const x=(e.clientX-b.left)*800/b.width, y=(e.clientY-b.top)*480/b.height;
  const h=hot.find(o=>x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h);
  $('tip').textContent=h?h.s:'';
};

setInterval(()=>{t++;draw()},70);
poll(); setInterval(poll,8000);
</script></body></html>
