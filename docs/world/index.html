<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Civilization</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1624;color:#d8e4f0;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
#hud{position:absolute;left:12px;top:12px;pointer-events:none}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
.sub{font-size:11px;color:#8aa0b8;margin-top:2px}
#bar{position:absolute;left:12px;bottom:12px;font:11px ui-monospace,monospace;color:#8aa0b8;pointer-events:none}
#tip{position:absolute;right:12px;top:12px;max-width:280px;background:#121a28cc;padding:8px 10px;border-radius:6px;font:12px ui-monospace,monospace;pointer-events:none;opacity:0;transition:opacity .15s}
#tip.on{opacity:1}
</style></head><body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><h1>Digital Civilization</h1><div class="sub">Drag to pan · scroll to zoom · hover for details</div></div>
<div id="bar"></div>
<div id="tip"></div>
</div>
<script>
"use strict";
const cv=document.getElementById('c'), g=cv.getContext('2d');
const tip=document.getElementById('tip'), bar=document.getElementById('bar');
let W=null, t=0, hot=[];
let cam={x:0,y:0,z:1};
let drag=null;

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*d; cv.height=innerHeight*d;
  g.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize); resize();

function iso(x,y,h){
  const s=cam.z;
  const ix=(x-y)*s + cam.x + innerWidth/2;
  const iy=(x+y)*0.5*s - h*s + cam.y + innerHeight/2;
  return [ix,iy];
}
function box(x,y,w,h,z,col,roof){
  const [ix,iy]=iso(x,y,z);
  const sw=w*cam.z, sh=h*cam.z*0.5;
  g.fillStyle=roof||'#5a4030';
  g.beginPath();
  g.moveTo(ix,iy-sh*0.6);
  g.lineTo(ix+sw,iy);
  g.lineTo(ix,iy+sh*0.6);
  g.lineTo(ix-sw,iy);
  g.fill();
  g.fillStyle=col;
  g.fillRect(ix-sw*0.5,iy,sw,sh*1.2);
  return {x:ix-sw*0.5,y:iy-sh*0.6,w:sw,h:sh*1.8};
}

function draw(){
  const w=innerWidth, h=innerHeight;
  g.clearRect(0,0,w,h);
  // sky gradient
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#0c1522'); sky.addColorStop(1,'#152033');
  g.fillStyle=sky; g.fillRect(0,0,w,h);

  if(!W){g.fillStyle='#8aa0b8';g.font='14px system-ui';g.fillText('loading…',w/2-30,h/2);return}
  hot=[];

  // ground islands for districts
  const built={};
  (W.inventions||[]).forEach(i=>{if(i.task)built[i.task]=i});
  const dists=(W.districts||[]).slice(0,10);
  dists.forEach((d,i)=>{
    const ang=i/dists.length*Math.PI*2;
    const r=180;
    const cx=Math.cos(ang)*r, cy=Math.sin(ang)*r;
    // island base
    const [ix,iy]=iso(cx,cy,0);
    g.fillStyle='#1e3a2a';
    g.beginPath(); g.ellipse(ix,iy,90*cam.z,36*cam.z,0,0,6.28); g.fill();
    g.fillStyle='#2a4a34';
    g.beginPath(); g.ellipse(ix,iy-4*cam.z,70*cam.z,28*cam.z,0,0,6.28); g.fill();
    // buildings on island
    (d.tasks||[]).slice(0,6).forEach((tk,k)=>{
      const ox=cx+(k%3-1)*22, oy=cy+((k/3)|0-0.5)*18;
      const col=built[tk.n]?'#4aa3ff':'#6a5538';
      const roof=built[tk.n]?'#2a5a8a':'#4a3c28';
      const hit=box(ox,oy,8,6,built[tk.n]?10:4,col,roof);
      hot.push({...hit,s:'#'+tk.n+' '+tk.title+(built[tk.n]?'  [built]':'')});
    });
    // label
    g.fillStyle='#e8f0f8'; g.font='11px system-ui';
    g.fillText(d.name.slice(0,16),ix-40,iy+50*cam.z);
  });

  // central charter hall
  const ch=box(0,0,16,12,18,'#9aa8c0','#6a4a3a');
  hot.push({...ch,s:'Charter Hall'});
  g.fillStyle='#fff'; g.font='12px system-ui';
  const [cx,cy]=iso(0,0,22);
  g.fillText('Charter',cx-22,cy-8);

  // chronicle & approval as side islands
  const cr=box(-220,40,12,8,8,'#c4a070','#7a3b2e');
  hot.push({...cr,s:'Chronicle · '+(W.journal||[]).length});
  const ap=box(220,40,12,8,8,'#8a6aa8','#4a3a5a');
  hot.push({...ap,s:'Approval · '+(W.pending_contributions||0)+' pending'});

  // agents as little figures on the central island
  const busy={};
  (W.working||[]).forEach((k,i)=>{
    busy[k.agent]=1;
    const ang=t/40+i;
    const x=Math.cos(ang)*30, y=Math.sin(ang)*30;
    const [ix,iy]=iso(x,y,6);
    g.fillStyle=k.stalled?'#666':'#f0c8a0';
    g.beginPath(); g.arc(ix,iy,4*cam.z,0,6.28); g.fill();
    hot.push({x:ix-6,y:iy-6,w:12,h:12,s:k.agent+' #'+k.task});
  });

  // soft vignette
  const vig=g.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h*0.8);
  vig.addColorStop(0,'transparent'); vig.addColorStop(1,'#0e162488');
  g.fillStyle=vig; g.fillRect(0,0,w,h);
}

function show(d){
  W=d;
  const c=d.counts||{};
  bar.textContent='updated '+(d.generated||'').slice(0,19).replace('T',' ')+'  |  p '+(c.pending||0)+'  r '+(c.running||0)+'  d '+(c.done||0)+'  f '+(c.failed||0);
}

async function poll(){
  try{
    const r=await fetch('world.json?'+Date.now(),{cache:'no-store'});
    if(r.ok) show(await r.json());
  }catch(e){bar.textContent='no world.json'}
}

cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};cv.classList.add('drag')};
addEventListener('mouseup',()=>{drag=null;cv.classList.remove('drag')});
addEventListener('mousemove',e=>{
  if(drag){
    cam.x=drag.cx+(e.clientX-drag.x);
    cam.y=drag.cy+(e.clientY-drag.y);
  }
  const b=cv.getBoundingClientRect();
  const x=e.clientX-b.left, y=e.clientY-b.top;
  const h=hot.find(o=>x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h);
  if(h){tip.textContent=h.s;tip.classList.add('on');tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px'}
  else tip.classList.remove('on');
});
cv.onwheel=e=>{e.preventDefault();cam.z=Math.max(0.4,Math.min(2.5,cam.z*(e.deltaY>0?0.92:1.08)))};

setInterval(()=>{t++;draw()},50);
poll(); setInterval(poll,8000);
</script></body></html>
