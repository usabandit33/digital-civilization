name: Staged Secrets Scanner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "inventions/staged-secrets-scanner/**"
      - "inventions/README.md"
      - ".github/workflows/staged-secrets-scanner-tests.yml"
  push:
    branches: [main]
    paths:
      - "inventions/staged-secrets-scanner/**"
      - "inventions/README.md"
      - ".github/workflows/staged-secrets-scanner-tests.yml"

permissions:
  contents: read

jobs:
  staged-secrets-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner tests
        working-directory: inventions/staged-secrets-scanner
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile scanner and tests
        working-directory: inventions/staged-secrets-scanner
        run: python -m py_compile scan_staged.py tests/test_scan_staged.py

      - name: Check clean-index CLI behavior
        working-directory: inventions/staged-secrets-scanner
        run: python scan_staged.py --repo ../.. --json
