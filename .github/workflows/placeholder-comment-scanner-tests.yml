name: Placeholder Comment Scanner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "inventions/placeholder-comment-scanner/**"
      - ".github/workflows/placeholder-comment-scanner-tests.yml"
  push:
    branches: [main]
    paths:
      - "inventions/placeholder-comment-scanner/**"
      - ".github/workflows/placeholder-comment-scanner-tests.yml"

permissions:
  contents: read

jobs:
  placeholder-comment-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run placeholder scanner tests
        run: python -m unittest discover -s inventions/placeholder-comment-scanner/tests -p 'test_*.py' -v
