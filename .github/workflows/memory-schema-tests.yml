name: Memory Contract and Consistency Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "memory/**"
      - ".github/workflows/memory-schema-tests.yml"
  push:
    branches: [main]
    paths:
      - "memory/**"
      - ".github/workflows/memory-schema-tests.yml"

permissions:
  contents: read

jobs:
  memory-contract-and-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check schema JSON
        run: python -m json.tool memory-record.schema.json >/dev/null

      - name: Run memory contract and consistency tests
        run: python -m unittest discover -s tests -v

      - name: Compile checker and tests
        run: python -m py_compile check_consistency.py tests/test_memory_consistency.py tests/test_memory_record_schema.py

      - name: Check the checked-in example
        run: python check_consistency.py examples --json
